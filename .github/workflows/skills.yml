name: skills
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Shared files must not drift
        run: make check
      - name: Build upload artifacts
        run: make zip
      - uses: actions/upload-artifact@v4
        with:
          name: skill-bundles
          path: "dist/*.skill"
